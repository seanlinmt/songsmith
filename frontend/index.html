<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songsmith — Local AI Song Studio</title>
    <script>
      /* Apply saved theme before first paint (mirrors the ss_theme logic in App.svelte). */
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('ss_theme') || 'system'; } catch (e) {}
        if (['light', 'dark', 'system'].indexOf(pref) === -1) pref = 'system';
        var light = pref === 'light' ||
          (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        var root = document.documentElement;
        if (light) root.setAttribute('data-theme', 'light');
        /* pre-CSS ground colour so there's no flash while stylesheets load */
        root.style.background = light ? '#f4f5f7' : '#0b0c0f';
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Cpath d='M40 14v22.5a7.5 7.5 0 1 0 3 6V24h7v-6h-7v-4z' fill='url(%23g)'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
