name: ace-step-xl-turbo
overrides:
  backend: ace-step
  known_usecases:
    - sound_generation
  options:
    - device:auto
    - offload_to_cpu:true
    - init_lm:true
    - lm_model_path:acestep-5Hz-lm-0.6B
